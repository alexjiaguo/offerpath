  <script>
    window.__timelines = window.__timelines || {};
    const subs = [
      'compositions/beat-1-hook.html',
      'compositions/beat-2-promise.html',
      'compositions/beat-3-discovery.html',
      'compositions/beat-4-resume.html',
      'compositions/beat-5-interview.html',
      'compositions/beat-6-cta.html',
    ];
    Promise.all(subs.map(p => fetch(p).then(r => r.text()).then(html => {
      const wrap = document.createElement('div');
      wrap.innerHTML = html;
      const tpl = wrap.querySelector('template');
      if (tpl) document.body.appendChild(tpl);
    }))).then(() => {
      window.__hfReady = true;
    });
