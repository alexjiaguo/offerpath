<template id="beat-1-template">
  <div data-composition-id="beat-1-hook" data-width="1920" data-height="1080">
    <style>
      
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        src: url('capture/assets/fonts/jakarta-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
        src: url('capture/assets/fonts/playfair-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 400 700;
        font-style: italic;
        font-display: swap;
        src: url('capture/assets/fonts/playfair-italic.woff2') format('woff2');
      }

      [data-composition-id="beat-1-hook"] {
        width: 1920px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        background: #FDFBF7;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #1C1B1A;
      }
      [data-composition-id="beat-1-hook"] .bg-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 60% 50% at 50% 48%, rgba(255, 230, 180, 0.18) 0%, rgba(253, 251, 247, 0) 70%);
        pointer-events: none;
      }
      [data-composition-id="beat-1-hook"] .content {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        box-sizing: border-box;
      }
      [data-composition-id="beat-1-hook"] .eyebrow {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #64748B;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      [data-composition-id="beat-1-hook"] .eyebrow::before,
      [data-composition-id="beat-1-hook"] .eyebrow::after {
        content: '';
        display: block;
        width: 28px;
        height: 1px;
        background: #64748B;
        opacity: 0.6;
      }
      [data-composition-id="beat-1-hook"] .logo-card {
        width: 200px;
        height: 200px;
        border-radius: 8px;
        background: #FFFFFF;
        box-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.18), 0 8px 20px -8px rgba(15, 23, 42, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      [data-composition-id="beat-1-hook"] .logo-card img {
        width: 132px;
        height: 132px;
        object-fit: contain;
      }
      [data-composition-id="beat-1-hook"] .statement {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-weight: 500;
        font-size: 56px;
        line-height: 1.1;
        color: #1C1B1A;
        max-width: 880px;
        text-align: center;
        letter-spacing: -0.01em;
        clip-path: inset(0 100% 0 0);
        -webkit-clip-path: inset(0 100% 0 0);
      }
      [data-composition-id="beat-1-hook"] .wordmark {
        position: absolute;
        left: 56px;
        bottom: 40px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      [data-composition-id="beat-1-hook"] .wordmark .mark {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }
      [data-composition-id="beat-1-hook"] .wordmark .text {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #1C1B1A;
      }
      [data-composition-id="beat-1-hook"] .rule-tl,
      [data-composition-id="beat-1-hook"] .rule-tr,
      [data-composition-id="beat-1-hook"] .rule-bl,
      [data-composition-id="beat-1-hook"] .rule-br {
        position: absolute;
        width: 36px;
        height: 1px;
        background: #1C1B1A;
        opacity: 0.18;
      }
      [data-composition-id="beat-1-hook"] .rule-tl { top: 56px; left: 56px; }
      [data-composition-id="beat-1-hook"] .rule-tr { top: 56px; right: 56px; }
      [data-composition-id="beat-1-hook"] .rule-bl { bottom: 56px; left: 56px; }
      [data-composition-id="beat-1-hook"] .rule-br { bottom: 56px; right: 56px; }
    </style>

    <div class="bg-glow"></div>
    <div class="rule-tl"></div>
    <div class="rule-tr"></div>
    <div class="rule-bl"></div>
    <div class="rule-br"></div>

    <div class="content">
      <div class="eyebrow">Introducing</div>
      <div class="logo-card">
        <img src="capture/assets/logo.png" alt="OfferPath" />
      </div>
      <div class="statement">From search to signed offer.</div>
    </div>

    <div class="wordmark">
      <img class="mark" src="capture/assets/mark.svg" alt="" />
      <span class="text">OfferPath</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(".eyebrow", { opacity: 0, y: -8, duration: 0.5, ease: "power2.out" }, 0.3);
      tl.from(".logo-card", { opacity: 0, y: 30, duration: 0.8, ease: "power3.out" }, 0.4);
      tl.from(".statement", { opacity: 0, duration: 0.05 }, 0.9);
      tl.to(".statement", { clipPath: "inset(0 0% 0 0)", webkitClipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power3.out" }, 0.9);
      tl.from(".wordmark", { opacity: 0, y: 8, duration: 0.6, ease: "power2.out" }, 1.4);
      window.__timelines["beat-1-hook"] = tl;
    </script>
  </div>
</template>
