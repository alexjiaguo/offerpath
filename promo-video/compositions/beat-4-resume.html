<template id="beat-4-template">
  <div data-composition-id="beat-4-resume" data-width="1920" data-height="1080">
    <style>
      
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        src: url('capture/assets/fonts/jakarta-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
        src: url('capture/assets/fonts/playfair-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 400 700;
        font-style: italic;
        font-display: swap;
        src: url('capture/assets/fonts/playfair-italic.woff2') format('woff2');
      }

      [data-composition-id="beat-4-resume"] {
        width: 1920px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        background: #FDFBF7;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #1C1B1A;
      }
      [data-composition-id="beat-4-resume"] .content {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        align-items: center;
        padding: 96px 120px 80px;
        box-sizing: border-box;
        gap: 60px;
      }
      [data-composition-id="beat-4-resume"] .left {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      [data-composition-id="beat-4-resume"] .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #64748B;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      [data-composition-id="beat-4-resume"] .eyebrow .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3B82F6;
      }
      [data-composition-id="beat-4-resume"] .hero-num {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 200px;
        line-height: 0.9;
        color: #1C1B1A;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
      }
      [data-composition-id="beat-4-resume"] .hero-unit {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-weight: 500;
        font-size: 38px;
        line-height: 1.1;
        color: #1C1B1A;
        margin-top: -8px;
      }
      [data-composition-id="beat-4-resume"] .caption {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-weight: 500;
        font-size: 30px;
        line-height: 1.2;
        color: #1C1B1A;
        max-width: 520px;
        margin-top: 4px;
      }
      [data-composition-id="beat-4-resume"] .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      [data-composition-id="beat-4-resume"] .chip {
        background: #FFFFFF;
        border: 1px solid #E6E4DD;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #1C1B1A;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      [data-composition-id="beat-4-resume"] .chip.arrow {
        background: transparent;
        border: none;
        color: #64748B;
      }
      [data-composition-id="beat-4-resume"] .right {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      [data-composition-id="beat-4-resume"] .screenshot {
        width: 100%;
        max-width: 940px;
        height: auto;
        border-radius: 16px;
        border: 1px solid #E6E4DD;
        box-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.14);
        background: #FFFFFF;
        object-fit: cover;
        aspect-ratio: 16 / 8.5;
        transform-origin: 50% 60%;
      }
      [data-composition-id="beat-4-resume"] .wordmark {
        position: absolute;
        left: 56px;
        bottom: 40px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      [data-composition-id="beat-4-resume"] .wordmark .mark {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }
      [data-composition-id="beat-4-resume"] .wordmark .text {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #1C1B1A;
      }
    </style>

    <div class="content">
      <div class="left">
        <div class="eyebrow"><span class="dot"></span><span>Career Asset Studio &mdash; 03</span></div>
        <div class="hero-num">90</div>
        <div class="hero-unit">seconds.</div>
        <div class="caption">From base resume to a JD-tailored draft.</div>
        <div class="chip-row">
          <div class="chip">Base resume</div>
          <div class="chip arrow">&rarr;</div>
          <div class="chip">Tailored for Google Ads PM</div>
        </div>
      </div>
      <div class="right">
        <img class="screenshot" src="capture/assets/resume.png" alt="Career Asset Studio" />
      </div>
    </div>

    <div class="wordmark">
      <img class="mark" src="capture/assets/mark.svg" alt="" />
      <span class="text">OfferPath</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(".eyebrow", { opacity: 0, y: 10, duration: 0.5, ease: "power2.out" }, 0.0);
      tl.from(".hero-num", { opacity: 0, scale: 0.5, duration: 0.7, ease: "back.out(1.7)" }, 0.15);
      tl.from(".hero-unit", { opacity: 0, y: 12, duration: 0.5, ease: "power2.out" }, 0.5);
      tl.from(".caption", { opacity: 0, y: 16, duration: 0.6, ease: "power2.out" }, 0.7);
      tl.from(".right", { opacity: 0, y: 40, scale: 0.97, duration: 0.85, ease: "expo.out" }, 0.35);
      tl.from(".screenshot", { scale: 1, duration: 2.0, ease: "none" }, 0.4);
      tl.from(".chip:nth-child(1)", { opacity: 0, y: 8, duration: 0.4, ease: "power2.out" }, 1.1);
      tl.from(".chip:nth-child(2)", { opacity: 0, duration: 0.3 }, 1.25);
      tl.from(".chip:nth-child(3)", { opacity: 0, y: 8, duration: 0.4, ease: "power2.out" }, 1.35);
      tl.from(".wordmark", { opacity: 0, y: 8, duration: 0.5, ease: "power2.out" }, 0.0);
      window.__timelines["beat-4-resume"] = tl;
    </script>
  </div>
</template>
