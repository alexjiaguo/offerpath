<template id="beat-5-template">
  <div data-composition-id="beat-5-interview" data-width="1920" data-height="1080">
    <style>
      
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        src: url('capture/assets/fonts/jakarta-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
        src: url('capture/assets/fonts/playfair-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 400 700;
        font-style: italic;
        font-display: swap;
        src: url('capture/assets/fonts/playfair-italic.woff2') format('woff2');
      }

      [data-composition-id="beat-5-interview"] {
        width: 1920px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        background: #FDFBF7;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #1C1B1A;
      }
      [data-composition-id="beat-5-interview"] .content {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        padding: 96px 120px 80px;
        box-sizing: border-box;
        gap: 28px;
      }
      [data-composition-id="beat-5-interview"] .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      [data-composition-id="beat-5-interview"] .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #475569;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      [data-composition-id="beat-5-interview"] .eyebrow .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #F59E0B;
      }
      [data-composition-id="beat-5-interview"] .title {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 500;
        font-size: 48px;
        line-height: 1.05;
        color: #1C1B1A;
        letter-spacing: -0.01em;
      }
      [data-composition-id="beat-5-interview"] .title em {
        font-style: italic;
      }
      [data-composition-id="beat-5-interview"] .stat-card {
        background: #FFFFFF;
        border: 1px solid #E6E4DD;
        border-radius: 14px;
        padding: 18px 22px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0 4px 20px -10px rgba(0, 0, 0, 0.06);
      }
      [data-composition-id="beat-5-interview"] .trophy {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(180, 83, 9, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        color: #B45309;
      }
      [data-composition-id="beat-5-interview"] .stat-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      [data-composition-id="beat-5-interview"] .stat-num {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 32px;
        line-height: 1;
        color: #1C1B1A;
        font-variant-numeric: tabular-nums;
      }
      [data-composition-id="beat-5-interview"] .stat-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #475569;
      }
      [data-composition-id="beat-5-interview"] .screenshot-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      [data-composition-id="beat-5-interview"] .screenshot {
        width: 80%;
        max-width: 1450px;
        height: auto;
        border-radius: 16px;
        border: 1px solid #E6E4DD;
        box-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.12);
        background: #FFFFFF;
        object-fit: cover;
        aspect-ratio: 16 / 8.5;
        transform-origin: 50% 60%;
      }
      [data-composition-id="beat-5-interview"] .wordmark {
        position: absolute;
        left: 56px;
        bottom: 40px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      [data-composition-id="beat-5-interview"] .wordmark .mark {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }
      [data-composition-id="beat-5-interview"] .wordmark .text {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #1C1B1A;
      }
    </style>

    <div class="content">
      <div class="header">
        <div>
          <div class="eyebrow"><span class="dot"></span><span>Interview Prep &mdash; 04</span></div>
          <div class="title">Mock interviews, <em>scored on every answer</em>.</div>
        </div>
        <div class="stat-card">
          <div class="trophy">&#9733;</div>
          <div class="stat-body">
            <div class="stat-num" id="b5-score">0.0</div>
            <div class="stat-label">Avg. score</div>
          </div>
        </div>
      </div>

      <div class="screenshot-wrap">
        <img class="screenshot" src="capture/assets/interview.png" alt="Interview Prep" />
      </div>
    </div>

    <div class="wordmark">
      <img class="mark" src="capture/assets/mark.svg" alt="" />
      <span class="text">OfferPath</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(".screenshot-wrap", { opacity: 0, y: 50, scale: 0.97, duration: 0.9, ease: "expo.out" }, 0.0);
      tl.from(".screenshot", { scale: 1, duration: 2.2, ease: "none" }, 0.05);
      tl.from(".header", { opacity: 0, y: 14, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.from(".stat-card", { opacity: 0, y: 18, duration: 0.6, ease: "power2.out" }, 0.9);
      const score = { v: 0 };
      tl.to(score, {
        v: 4.2,
        duration: 0.7,
        ease: "power2.out",
        onUpdate: () => document.getElementById("b5-score").textContent = score.v.toFixed(1)
      }, 1.0);
      tl.from(".trophy", { scale: 0.6, duration: 0.4, ease: "back.out(1.6)" }, 1.2);
      tl.to(".trophy", { scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 1.2);
      tl.from(".wordmark", { opacity: 0, y: 8, duration: 0.5, ease: "power2.out" }, 0.0);
      window.__timelines["beat-5-interview"] = tl;
    </script>
  </div>
</template>
