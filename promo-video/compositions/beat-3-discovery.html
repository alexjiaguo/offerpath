<template id="beat-3-template">
  <div data-composition-id="beat-3-discovery" data-width="1920" data-height="1080">
    <style>
      
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        src: url('capture/assets/fonts/jakarta-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
        src: url('capture/assets/fonts/playfair-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 400 700;
        font-style: italic;
        font-display: swap;
        src: url('capture/assets/fonts/playfair-italic.woff2') format('woff2');
      }

      [data-composition-id="beat-3-discovery"] {
        width: 1920px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        background: #FDFBF7;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #1C1B1A;
      }
      [data-composition-id="beat-3-discovery"] .content {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        padding: 96px 120px 80px;
        box-sizing: border-box;
        gap: 36px;
      }
      [data-composition-id="beat-3-discovery"] .header {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      [data-composition-id="beat-3-discovery"] .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #475569;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      [data-composition-id="beat-3-discovery"] .eyebrow .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10B981;
      }
      [data-composition-id="beat-3-discovery"] .title {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 500;
        font-size: 44px;
        line-height: 1.1;
        color: #1C1B1A;
        letter-spacing: -0.01em;
      }
      [data-composition-id="beat-3-discovery"] .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      [data-composition-id="beat-3-discovery"] .stat {
        background: #FFFFFF;
        border: 1px solid #E6E4DD;
        border-radius: 16px;
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 4px 20px -10px rgba(0, 0, 0, 0.04);
      }
      [data-composition-id="beat-3-discovery"] .stat .num {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 64px;
        line-height: 1;
        color: #1C1B1A;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
      [data-composition-id="beat-3-discovery"] .stat .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #475569;
      }
      [data-composition-id="beat-3-discovery"] .stat.accent .num {
        color: #047857;
      }
      [data-composition-id="beat-3-discovery"] .stat .sub {
        font-size: 12px;
        color: #475569;
        margin-top: 4px;
      }
      [data-composition-id="beat-3-discovery"] .screenshot-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      [data-composition-id="beat-3-discovery"] .screenshot {
        width: 78%;
        max-width: 1420px;
        height: auto;
        border-radius: 16px;
        border: 1px solid #E6E4DD;
        box-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.12);
        background: #FFFFFF;
        object-fit: cover;
        aspect-ratio: 16 / 8.5;
        transform-origin: 50% 60%;
      }
      [data-composition-id="beat-3-discovery"] .wordmark {
        position: absolute;
        left: 56px;
        bottom: 40px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      [data-composition-id="beat-3-discovery"] .wordmark .mark {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }
      [data-composition-id="beat-3-discovery"] .wordmark .text {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #1C1B1A;
      }
    </style>

    <div class="content">
      <div class="header">
        <div class="eyebrow"><span class="dot"></span><span>Job Discovery &mdash; 02</span></div>
        <div class="title">30 leads, scored before you open the first one.</div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="num" id="b3-num-1">0</div>
          <div class="label">Total leads</div>
          <div class="sub">30 target companies &middot; auto-refreshed weekly</div>
        </div>
        <div class="stat">
          <div class="num" id="b3-num-2">0</div>
          <div class="label">Companies</div>
          <div class="sub">Cross-vertical coverage from AdTech to Fintech</div>
        </div>
        <div class="stat accent">
          <div class="num" id="b3-num-3">0%</div>
          <div class="label">Avg. match</div>
          <div class="sub">AI-anchored to your base resume</div>
        </div>
      </div>

      <div class="screenshot-wrap">
        <img class="screenshot" src="capture/assets/discover.png" alt="Job Discovery" />
      </div>
    </div>

    <div class="wordmark">
      <img class="mark" src="capture/assets/mark.svg" alt="" />
      <span class="text">OfferPath</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(".header", { opacity: 0, y: 14, duration: 0.5, ease: "power2.out" }, 0.0);
      tl.from(".stat:nth-child(1)", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.from(".stat:nth-child(2)", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.from(".stat:nth-child(3)", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 0.6);
      const num1 = { v: 0 };
      const num2 = { v: 0 };
      const num3 = { v: 0 };
      tl.to(num1, { v: 30, duration: 0.7, ease: "power2.out", onUpdate: () => document.getElementById("b3-num-1").textContent = Math.round(num1.v) }, 0.3);
      tl.to(num2, { v: 30, duration: 0.7, ease: "power2.out", onUpdate: () => document.getElementById("b3-num-2").textContent = Math.round(num2.v) }, 0.5);
      tl.to(num3, { v: 82, duration: 0.7, ease: "power2.out", onUpdate: () => document.getElementById("b3-num-3").textContent = Math.round(num3.v) + "%" }, 0.7);
      tl.from(".screenshot-wrap", { opacity: 0, y: 50, scale: 0.97, duration: 0.9, ease: "expo.out" }, 1.0);
      tl.from(".screenshot", { scale: 1, duration: 2.5, ease: "none" }, 1.05);
      tl.from(".wordmark", { opacity: 0, y: 8, duration: 0.5, ease: "power2.out" }, 0.0);
      window.__timelines["beat-3-discovery"] = tl;
    </script>
  </div>
</template>
