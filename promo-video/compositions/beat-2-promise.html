<template id="beat-2-template">
  <div data-composition-id="beat-2-promise" data-width="1920" data-height="1080">
    <style>
      
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        src: url('capture/assets/fonts/jakarta-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
        src: url('capture/assets/fonts/playfair-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 400 700;
        font-style: italic;
        font-display: swap;
        src: url('capture/assets/fonts/playfair-italic.woff2') format('woff2');
      }

      [data-composition-id="beat-2-promise"] {
        width: 1920px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        background: #FDFBF7;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #1C1B1A;
      }
      [data-composition-id="beat-2-promise"] .content {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        padding: 80px 120px;
        box-sizing: border-box;
        gap: 28px;
      }
      [data-composition-id="beat-2-promise"] .top-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      [data-composition-id="beat-2-promise"] .heading-block {
        max-width: 620px;
      }
      [data-composition-id="beat-2-promise"] .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #64748B;
        margin-bottom: 16px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      [data-composition-id="beat-2-promise"] .eyebrow .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10B981;
      }
      [data-composition-id="beat-2-promise"] .heading {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 500;
        font-size: 56px;
        line-height: 1.05;
        color: #1C1B1A;
        letter-spacing: -0.01em;
      }
      [data-composition-id="beat-2-promise"] .heading em {
        font-style: italic;
        color: #1C1B1A;
      }
      [data-composition-id="beat-2-promise"] .stat-card {
        background: #FFFFFF;
        border: 1px solid #E6E4DD;
        border-radius: 14px;
        padding: 18px 24px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        box-shadow: 0 4px 20px -10px rgba(0, 0, 0, 0.06);
      }
      [data-composition-id="beat-2-promise"] .stat-num {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 44px;
        line-height: 1;
        color: #1C1B1A;
      }
      [data-composition-id="beat-2-promise"] .stat-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #64748B;
      }
      [data-composition-id="beat-2-promise"] .screenshot-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      [data-composition-id="beat-2-promise"] .screenshot {
        width: 82%;
        max-width: 1480px;
        height: auto;
        border-radius: 16px;
        border: 1px solid #E6E4DD;
        box-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.12);
        background: #FFFFFF;
        object-fit: cover;
        aspect-ratio: 16 / 8.5;
        transform-origin: 50% 60%;
      }
      [data-composition-id="beat-2-promise"] .chip {
        position: absolute;
        right: 80px;
        bottom: 110px;
        background: #FFFFFF;
        border: 1px solid #E6E4DD;
        border-radius: 999px;
        padding: 10px 18px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #1C1B1A;
      }
      [data-composition-id="beat-2-promise"] .chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10B981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
      }
      [data-composition-id="beat-2-promise"] .wordmark {
        position: absolute;
        left: 56px;
        bottom: 40px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      [data-composition-id="beat-2-promise"] .wordmark .mark {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }
      [data-composition-id="beat-2-promise"] .wordmark .text {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #1C1B1A;
      }
    </style>

    <div class="content">
      <div class="top-row">
        <div class="heading-block">
          <div class="eyebrow"><span class="dot"></span><span>The Workspace</span></div>
          <div class="heading">A system that <em>thinks with you</em>.</div>
        </div>
        <div class="stat-card">
          <div class="stat-num">8</div>
          <div class="stat-label">Active jobs</div>
        </div>
      </div>

      <div class="screenshot-wrap">
        <img class="screenshot" src="capture/assets/dashboard.png" alt="OfferPath dashboard" />
      </div>
    </div>

    <div class="chip"><span class="dot"></span><span>AI &mdash; Anchored</span></div>

    <div class="wordmark">
      <img class="mark" src="capture/assets/mark.svg" alt="" />
      <span class="text">OfferPath</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(".screenshot-wrap", { opacity: 0, y: 60, scale: 0.96, duration: 0.9, ease: "expo.out" }, 0);
      tl.from(".screenshot", { scale: 1, duration: 2.6, ease: "none" }, 0.05);
      tl.from(".eyebrow", { opacity: 0, y: 12, duration: 0.5, ease: "power2.out" }, 0.35);
      tl.from(".heading", { opacity: 0, y: 20, duration: 0.7, ease: "power2.out" }, 0.5);
      tl.from(".stat-card", { opacity: 0, y: 20, duration: 0.6, ease: "power2.out" }, 0.9);
      tl.from(".chip", { opacity: 0, y: 14, duration: 0.5, ease: "power2.out" }, 1.4);
      tl.from(".wordmark", { opacity: 0, y: 8, duration: 0.5, ease: "power2.out" }, 0.0);
      window.__timelines["beat-2-promise"] = tl;
    </script>
  </div>
</template>
